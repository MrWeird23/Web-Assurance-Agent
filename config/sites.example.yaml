version: 1
sites:
  - id: example-site
    allowed_hosts:
      - example.com
    pages:
      - id: example-home
        url: https://example.com/
        viewports:
          - id: desktop
            width: 1440
            height: 900
            device_scale_factor: 1.0
          - id: mobile
            width: 390
            height: 844
            device_scale_factor: 3.0
        required_text:
          - Example Domain
        required_selectors:
          - main
        forbidden_text:
          - Fatal error
          - Parse error
          - There has been a critical error on this website
        critical_resource_patterns: []
        ignored_resource_patterns: []
        screenshot_masks: []
        interactions: []
